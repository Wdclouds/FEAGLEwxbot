<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEAGLE WxBot 控制台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      user-select: none;
    }
    .container {
      text-align: center;
      padding: 2.2rem;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 580px;
      width: 100%;
      transition: all 0.3s ease;
    }
    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.4rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin-bottom: 1.4rem;
      line-height: 1.6;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.16); }
    .btn-outline {
      background: transparent;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .btn-outline:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: #38bdf8;
    }
    .toast {
      display: none;
      margin-top: 0.6rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.82rem;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }
    .log-container {
      display: none;
      margin-top: 1.2rem;
      text-align: left;
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.8rem;
      max-height: 220px;
      overflow-y: auto;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.4;
      user-select: text;
    }
    .log-container pre {
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">FEAGLE WxBot</div>
    <div class="subtitle">Windows 绿色本地桌面宿主</div>
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="status">正在唤醒本地微信中枢 Bridge 服务 (6190)...</div>

    <div class="actions">
      <button class="btn" id="retry-btn" onclick="retryConnect()">手动重试连接</button>
      <button class="btn btn-secondary" id="toggle-log-btn" onclick="toggleLogs()">查看实时日志</button>
      <button class="btn btn-secondary" id="copy-log-btn" onclick="copyLogs()">一键复制错误日志</button>
      <button class="btn btn-outline" id="open-browser-btn" onclick="openInBrowser()">在浏览器打开</button>
    </div>

    <div id="toast" class="toast"></div>

    <div class="log-container" id="log-box">
      <pre id="log-content">正在搜集启动日志与本地环境信息...</pre>
    </div>
  </div>

  <script>
    const TARGET_URL = 'http://127.0.0.1:6190';
    let attempts = 0;
    const maxAttempts = 30;
    const localLogs = [];
    let isConnected = false;

    function addLog(msg) {
      const time = new Date().toLocaleTimeString();
      const line = `[${time}] ${msg}`;
      localLogs.push(line);
      updateLogBox();
    }

    async function fetchTauriLogs() {
      if (window.__TAURI__ && window.__TAURI__.invoke) {
        try {
          const tauriLogs = await window.__TAURI__.invoke('get_bridge_logs');
          if (Array.isArray(tauriLogs) && tauriLogs.length > 0) {
            return tauriLogs;
          }
        } catch (e) {
          // ignore
        }
      }
      return [];
    }

    async function fetchTauriStatus() {
      if (window.__TAURI__ && window.__TAURI__.invoke) {
        try {
          return await window.__TAURI__.invoke('get_bridge_status');
        } catch (e) {
          return { error: e.toString() };
        }
      }
      return null;
    }

    async function updateLogBox() {
      const box = document.getElementById('log-content');
      if (!box) return;
      const tauriLogs = await fetchTauriLogs();
      const allLines = [...localLogs];
      if (tauriLogs.length > 0) {
        allLines.push('--- [Tauri 子进程输出] ---');
        allLines.push(...tauriLogs);
      }
      box.textContent = allLines.join('\n');
      const container = document.getElementById('log-box');
      if (container) container.scrollTop = container.scrollHeight;
    }

    function toggleLogs() {
      const box = document.getElementById('log-box');
      const btn = document.getElementById('toggle-log-btn');
      if (box.style.display === 'block') {
        box.style.display = 'none';
        btn.textContent = '查看实时日志';
      } else {
        box.style.display = 'block';
        btn.textContent = '隐藏实时日志';
        updateLogBox();
      }
    }

    async function checkAndRedirect() {
      if (isConnected) return;
      attempts++;
      addLog(`正在探测 Bridge 服务状态 (第 ${attempts}/${maxAttempts} 次)...`);

      // 1. 优先通过 Tauri 原生命令检查（原生 Socket 探测，不受 WebView2 Mixed Content 限制）
      if (window.__TAURI__ && window.__TAURI__.invoke) {
        try {
          const isReady = await window.__TAURI__.invoke('check_bridge_ready');
          const status = await window.__TAURI__.invoke('get_bridge_status');
          addLog(`Tauri 宿主探测: 端口就绪=${isReady}, 运行状态=${status.running}, PID=${status.pid || '无'}`);
          if (isReady || status.port_ready || status.running) {
            isConnected = true;
            document.getElementById('status').innerText = 'Bridge 服务已就绪，正在加载控制台界面...';
            addLog('探测到 6190 端口已就绪，正在跳转...');
            setTimeout(() => {
              window.location.href = TARGET_URL;
            }, 300);
            return;
          }
        } catch (tauriErr) {
          addLog(`Tauri 原生探测提示: ${tauriErr.message || tauriErr}`);
        }
      }

      // 2. 浏览器 fetch 探测兜底
      try {
        const res = await fetch(TARGET_URL + '/api/status', { method: 'GET', cache: 'no-cache' });
        if (res.ok) {
          isConnected = true;
          document.getElementById('status').innerText = 'Bridge 服务已就绪，正在加载控制台界面...';
          addLog('探测到 6190 端口已就绪，正在跳转...');
          setTimeout(() => {
            window.location.href = TARGET_URL;
          }, 300);
          return;
        } else {
          addLog(`Bridge 响应非正常状态码: ${res.status} ${res.statusText}`);
        }
      } catch (err) {
        addLog(`探测连接失败: ${err.message || err}`);
      }

      if (attempts < maxAttempts) {
        document.getElementById('status').innerText = `正在启动本地 Bridge (尝试 ${attempts}/${maxAttempts})...`;
        setTimeout(checkAndRedirect, 1000);
      } else {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').innerHTML = '<span style="color:#f87171;">连接超时</span>：本地微信中枢未在预期时间内就绪。<br>请点击下方【查看实时日志】或【一键复制错误日志】。';
        document.getElementById('log-box').style.display = 'block';
        document.getElementById('toggle-log-btn').textContent = '隐藏实时日志';
        updateLogBox();
      }
    }

    function retryConnect() {
      attempts = 0;
      isConnected = false;
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('status').innerText = '正在重试连接本地微信中枢 (6190)...';
      addLog('用户触发手动重试连接...');
      checkAndRedirect();
    }

    async function copyLogs() {
      const statusObj = await fetchTauriStatus();
      const tauriLogs = await fetchTauriLogs();
      const report = [
        '=== FEAGLE WxBot 桌面客户端错误诊断日志 ===',
        `生成时间: ${new Date().toLocaleString()}`,
        `目标地址: ${TARGET_URL}`,
        `尝试次数: ${attempts}`,
        `宿主内核: ${navigator.userAgent}`,
        '',
        '--- [Tauri 宿主状态] ---',
        JSON.stringify(statusObj || {}, null, 2),
        '',
        '--- [连接探测轨迹] ---',
        localLogs.join('\n'),
        '',
        '--- [Node.js 进程输出 / 错误日志] ---',
        tauriLogs.length > 0 ? tauriLogs.join('\n') : '(无子进程输出，或进程尚未产生日志)',
        '========================================='
      ].join('\n');

      let copied = false;
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(report);
          copied = true;
        } catch (e) {}
      }
      if (!copied) {
        const ta = document.createElement('textarea');
        ta.value = report;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          copied = true;
        } catch (e) {}
        document.body.removeChild(ta);
      }

      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      if (copied) {
        toast.textContent = '✓ 错误诊断日志已成功复制到剪贴板！可以直接粘贴反馈。';
        toast.style.color = '#4ade80';
        toast.style.borderColor = 'rgba(34, 197, 94, 0.4)';
      } else {
        toast.textContent = '复制失败，请在下方日志窗口中手动全选复制。';
        toast.style.color = '#f87171';
        toast.style.borderColor = 'rgba(248, 113, 113, 0.4)';
      }
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function openInBrowser() {
      addLog('正在尝试唤醒默认外部浏览器打开: ' + TARGET_URL);
      if (window.__TAURI__ && window.__TAURI__.shell) {
        window.__TAURI__.shell.open(TARGET_URL);
      } else {
        window.open(TARGET_URL, '_blank');
      }
    }

    // 启动初始连接探测
    setTimeout(checkAndRedirect, 500);
  </script>
</body>
</html>
