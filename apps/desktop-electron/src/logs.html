<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FEAGLE WxBot - 实时运行日志</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 12px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      color: #f0f6fc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: rgba(254, 192, 26, 0.15);
      color: #fec01a;
      border: 1px solid rgba(254, 192, 26, 0.3);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      background: #30363d;
      color: #fff;
    }
    #log-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .line {
      margin-bottom: 3px;
    }
    .time { color: #8b949e; margin-right: 8px; }
    .tag-system { color: #58a6ff; }
    .tag-Bridge { color: #39c5bb; }
    .tag-Memory { color: #d2a8ff; }
    .tag-error { color: #ff7b72; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>FEAGLE 系统日志 <span class="badge">Live Stream</span></h1>
    <div class="actions">
      <button id="copy-btn">复制日志</button>
      <button id="clear-btn">清屏</button>
    </div>
  </header>
  <div id="log-container"></div>

  <script>
    const container = document.getElementById('log-container');
    const copyBtn = document.getElementById('copy-btn');
    const clearBtn = document.getElementById('clear-btn');

    function appendEntry(entry) {
      const line = document.createElement('div');
      line.className = 'line';

      const tagClass = 'tag-' + (entry.tag || 'system').replace(/:/g, '-');
      line.innerHTML = `<span class="time">[${entry.timestamp}]</span><span class="${tagClass}">[${entry.tag}]</span> ${escapeHtml(entry.message)}`;
      container.appendChild(line);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    if (window.feagleDesktop) {
      window.feagleDesktop.getLogs().then(logs => {
        logs.forEach(appendEntry);
      });
      window.feagleDesktop.onLog(appendEntry);
    }

    copyBtn.addEventListener('click', () => {
      const text = container.innerText;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = '已复制!';
        setTimeout(() => copyBtn.textContent = '复制日志', 1500);
      });
    });

    clearBtn.addEventListener('click', () => {
      container.innerHTML = '';
    });
  </script>
</body>
</html>
