services:
  bot:
    build:
      context: ./bot
    container_name: Feagle-wxbot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: Asia/Shanghai
      ASTRBOT_ROOT: /app
      PYTHONPATH: /app/AstrBot
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${ASTRBOT_WEBUI_HOST_PORT:-6185}:6185"
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-6190}:6190"
      - "${ANDROID_WS_BIND_HOST:-127.0.0.1}:${ANDROID_WS_HOST_PORT:-6191}:${ANDROID_WS_PORT:-6191}"
    networks:
      - bot_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6190/api/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

networks:
  bot_net:
    driver: bridge
