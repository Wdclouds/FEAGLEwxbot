name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Check repository for secrets and runtime data
        working-directory: .
        run: ./scripts/check-secrets.sh
      - name: Test shell setup and safety guards
        working-directory: .
        run: bash ./scripts/test-shell.sh
      - run: npm ci
      - run: npm test
